services:
  chispa:
    build: .
    container_name: chispa-lectura
    # Por defecto escucha en toda la red, puerto 3100. En un servidor con HTTPS delante
    # (docs/SERVIDOR.md) pon CHISPA_BIND=127.0.0.1 en un archivo .env junto a este.
    ports:
      - "${CHISPA_BIND:-0.0.0.0}:${CHISPA_PORT:-3100}:3000"
    volumes:
      - ./data:/data
      - ./content:/app/content:ro
    environment:
      - PORT=3000
      - DB_PATH=/data/lectura.db
      - TZ=America/Mexico_City
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
